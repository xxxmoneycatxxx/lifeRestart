[package]
name = "liferestart-desktop"
version = "3.0.0"
description = "人生重开模拟器"
authors = ["Vick Scarlet <vick@syaro.io>"]
edition = "2021"

[lib]
name = "liferestart_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
strip = "debuginfo"  # Remove bulky debug symbols, keep line numbers for backtraces

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
